spring.application.name=cityfeedback_api

# Ohne ausdrücklich gesetztes Profil wird "dev" verwendet (lädt Testdaten).
# Tests laufen mit dem Profil "test" (siehe src/test/resources/application-test.properties).
spring.profiles.default=dev

# --- Datenbank: H2 In-Memory -------------------------------------------------
# Die Daten existieren nur, solange die Anwendung läuft.
spring.datasource.url=jdbc:h2:mem:cityfeedback;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Schema kommt aus schema.sql, Hibernate legt selbst keine Tabellen an
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# H2-Konsole unter http://localhost:8080/h2-console
# (JDBC-URL: jdbc:h2:mem:cityfeedback, Benutzer: sa, kein Passwort)
spring.h2.console.enabled=true

# --- REST / Fehlerantworten ----------------------------------------------------
# Fehler (z. B. Validierung) als "Problem Details" (RFC 9457) zurückgeben
spring.mvc.problemdetails.enabled=true

# --- OpenAPI / Swagger ---------------------------------------------------------
# Swagger UI:     http://localhost:8080/swagger-ui.html
# OpenAPI (JSON): http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
