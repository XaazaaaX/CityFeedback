# CI/CD-Pipeline für die CityFeedback-API (Maven-Projekt unter api/)
#
#   lint    – Checkstyle über Produktiv- und Testcode
#   build   – kompiliert, führt alle Tests aus (inkl. ArchUnit) und misst die Coverage (JaCoCo)
#   release-preview – bei PRs und auf dev: semantic-release im Dry-Run, zeigt die nächste
#             Version und die Release Notes im Job-Summary (es wird nichts veröffentlicht)
#   release – nur auf main: semantic-release bestimmt anhand der Commit-Messages die nächste
#             Version, erstellt Git-Tag + GitHub Release (mit Release Notes und JAR)
#   docker  – baut das Docker-Image; auf main/dev wird es nach GHCR gepusht,
#             nach einem Release zusätzlich mit der Versionsnummer getaggt
name: CI/CD

on:
  push:
    branches: [main, dev]
    paths-ignore: ['doc/**', '**/*.md']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['doc/**', '**/*.md']
  workflow_dispatch:

# Ältere Läufe desselben PRs abbrechen, sobald neue Commits kommen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '25'   # muss zu <java.version> in api/pom.xml passen
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK ${{ env.JAVA_VERSION }} einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Checkstyle
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp checkstyle:check

      - name: Zusammenfassung
        if: always()
        run: python3 ../.github/scripts/ci-summary.py target checkstyle >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK ${{ env.JAVA_VERSION }} einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: api/pom.xml

      # Checkstyle läuft bereits im Job "lint"
      - name: Build, Tests & Coverage
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify -Dcheckstyle.skip

      - name: Zusammenfassung (Tests & Coverage)
        if: always()
        run: python3 ../.github/scripts/ci-summary.py target tests >> "$GITHUB_STEP_SUMMARY"

      - name: Test- und Coverage-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            api/target/surefire-reports/
            api/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: JAR hochladen
        uses: actions/upload-artifact@v7
        with:
          name: cityfeedback-api-jar
          path: api/target/*.jar
          if-no-files-found: error
          retention-days: 14

  release-preview:
    name: Release-Vorschau (Dry-Run)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # semantic-release prüft auch im Dry-Run, ob es nach main pushen dürfte (pusht aber nichts)
      contents: write
    steps:
      - name: Checkout (komplette Historie inkl. Tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node ${{ env.NODE_VERSION }} einrichten
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: semantic-release installieren
        run: >
          npm install --no-save --no-audit --no-fund
          semantic-release@25
          @semantic-release/exec@7
          conventional-changelog-conventionalcommits@9

      # Den späteren Merge nach main nachstellen, damit die Vorschau die echten Release-Tags kennt
      - name: Merge nach main simulieren
        id: sim
        run: |
          if git -c user.name="CI" -c user.email="ci@localhost" merge --no-edit --no-ff origin/main; then
            git checkout --quiet --detach
            git branch -f main origin/main
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "## 🔮 Release-Vorschau (Dry-Run)"
              echo
              echo "⚠️ Keine Vorschau möglich: Der Stand lässt sich nicht konfliktfrei mit \`main\` zusammenführen."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release-Vorschau erstellen
        if: steps.sim.outputs.ok == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-preview.mjs

  release:
    name: Release (semantic-release)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # Tag + GitHub Release anlegen
      issues: write          # Kommentare an verknüpften Issues
      pull-requests: write   # Kommentare an verknüpften PRs
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Checkout (komplette Historie für die Commit-Analyse)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: JDK ${{ env.JAVA_VERSION }} einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Node ${{ env.NODE_VERSION }} einrichten
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: semantic-release installieren
        run: >
          npm install --no-save --no-audit --no-fund
          semantic-release@25
          @semantic-release/exec@7
          conventional-changelog-conventionalcommits@9

      # Konfiguration: .releaserc.json
      - name: Release erstellen
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Zusammenfassung
        if: always()
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "## 🚀 Release v$VERSION veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Kein neues Release (keine feat/fix/perf-Commits seit dem letzten Release)" >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Docker Image
    needs: [lint, build, release]
    # Läuft auch, wenn "release" übersprungen wurde (PRs, dev), aber nie nach Fehlern
    if: >-
      !cancelled()
      && needs.lint.result == 'success'
      && needs.build.result == 'success'
      && needs.release.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # Docker-Abschnitt an das GitHub Release anhängen
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GHCR verlangt Kleinbuchstaben (Owner heißt "XaazaaaX")
      - name: Image-Namen bestimmen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cityfeedback-api" >> "$GITHUB_ENV"

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      # main: Version (nach Release), main, latest und sha-<commit>
      # dev:  nur dev (wird bei jedem Push überschrieben)
      - name: Tags & Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # In PRs wird das Image nur gebaut (prüft das Dockerfile), aber nicht gepusht
      - name: Image bauen (und pushen)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: api
          push: ${{ github.event_name != 'pull_request' }}
          build-args: REVISION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nach einem Release: Verweis auf das veröffentlichte Image in die Release Notes schreiben
      - name: Docker-Image im GitHub Release verlinken
        if: env.VERSION != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/cityfeedback-api
        run: |
          TAG="v${VERSION}"
          MINOR="${VERSION%.*}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## 🐳 Docker-Image"
            echo
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "docker run -p 8080:8080 ${IMAGE}:${VERSION}"
            echo "\`\`\`"
            echo
            echo "| Tags | Digest |"
            echo "|---|---|"
            echo "| \`${VERSION}\` · \`${MINOR}\` · \`latest\` | \`${DIGEST}\` |"
            echo
            echo "📦 [Image auf GitHub Packages](${PACKAGE_URL})"
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Docker-Abschnitt an Release $TAG angehängt." >> "$GITHUB_STEP_SUMMARY"
